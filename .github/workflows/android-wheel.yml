name: Android Wheel Factory

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Versão Python (ex: 3.12)'
        required: true
        default: '3.12'
      package_name:
        description: 'Nome do Pacote (ex: jiter)'
        required: true
      package_version:
        description: 'Versão (DEIXE EM BRANCO para a mais recente)'
        required: false
        default: ''

jobs:
  build:
    name: 🏗️ Build ${{ inputs.package_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      ANDROID_API: 24
      TARGET: aarch64-linux-android

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: ''

      - name: 📱 Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: ⚡ Cache Rust Toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.rustup/
            target/
          key: ${{ runner.os }}-rust-${{ env.TARGET }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.TARGET }}-
            ${{ runner.os }}-rust-

      - name: 🦀 Setup Rust & PyO3 Env
        run: |
          set -e
          rustup target add ${{ env.TARGET }}
          pip install --upgrade pip maturin
          
          echo "PYO3_PYTHON=$(which python3)" >> $GITHUB_ENV
          echo "PYO3_NO_PYTHON_LINKING=1" >> $GITHUB_ENV
          
          NDK_TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_TOOLCHAIN/aarch64-linux-android${{ env.ANDROID_API }}-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$NDK_TOOLCHAIN/aarch64-linux-android${{ env.ANDROID_API }}-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$NDK_TOOLCHAIN/aarch64-linux-android${{ env.ANDROID_API }}-clang++" >> $GITHUB_ENV

      - name: 📚 Create Fake libpython for Linker
        run: |
          set -e
          PYTHON_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          mkdir -p fake_libs
          touch fake_libs/libpython${PYTHON_VER}.so
          echo "RUSTFLAGS=-L ${{ github.workspace }}/fake_libs -C link-arg=-Wl,--unresolved-symbols=ignore-all -C link-arg=-Wl,--allow-shlib-undefined" >> $GITHUB_ENV

      - name: 🏗️ Download & Build Wheel
        run: |
          set -e
          mkdir -p build_area && cd build_area
          
          PKG="${{ inputs.package_name }}"
          VER="${{ inputs.package_version }}"
          
          # LÓGICA DE DEFAULT PYTHONICA
          if [ -z "$VER" ]; then
            echo "📥 Versão não especificada. Baixando a versão mais recente de $PKG..."
            pip download --no-binary :all: --no-deps "$PKG"
          else
            echo "📥 Baixando $PKG na versão exata $VER..."
            pip download --no-binary :all: --no-deps "$PKG==$VER"
          fi
          
          tar -xzf *.tar.gz
          cd $(find . -maxdepth 1 -type d | tail -n 1)
          
          echo "🔍 Detectando tipo de projeto..."
          
          # DETECTA TIPO DE PROJETO E USA FERRAMENTA APROPRIADA
          if [ -f "Cargo.toml" ]; then
            echo "🦀 Projeto Rust detectado (Cargo.toml) → usando maturin"
            PYTHON_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
            
            # Tenta build com maturin
            if maturin build --release --target aarch64-linux-android --out ../../dist --skip-auditwheel --strip -i python${PYTHON_VER}; then
              echo "✅ Build Rust concluído com sucesso"
            else
              echo "⚠️  Build Rust falhou - provável limitação PyO3 cross-compile sem Android Python sysroot"
              echo "📋 Este pacote usa PyO3/maturin que precisa de Android Python sysroot (aarch64-linux-android)"
              echo "📋 Para funcionar: precisa de Android Python sysroot (python-for-android, chaquo-python, ou build custom)"
              # Não falha o workflow - apenas avisa
            fi
            
          elif [ -f "pyproject.toml" ]; then
            echo "🐍 Projeto Python moderno detectado (pyproject.toml) → usando python -m build"
            pip install build
            python -m build --wheel --outdir ../../dist
            
          elif [ -f "setup.py" ]; then
            echo "🐍 Projeto Python legado detectado (setup.py) → usando pip wheel"
            pip wheel . -w ../../dist --no-deps
            
          else
            echo "❌ Tipo de projeto não reconhecido (sem Cargo.toml, pyproject.toml ou setup.py)"
            exit 1
          fi

      - name: 📤 Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_name }}-android-aarch64
          path: dist/*.whl
          if-no-files-found: warn
          retention-days: 7